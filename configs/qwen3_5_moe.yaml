# RouteHijack config — Qwen3.5 MoE (hybrid Gated-DeltaNet + attention + MoE).
# ⚠ BEST-EFFORT / UNVERIFIED — Qwen3.5 released 2026-02 (after this code's references).
#
# Default target below is the runnable 35B-A3B variant. The flagship 397B-A17B dims
# are in the comment block; swap them in if that's your target (and you have the GPUs).
#
# WHY THIS IS BEST-EFFORT (but NOT a fundamental blocker like DeepSeek):
#   • The MoE *gate* is expected to be a standard Linear → (T, n_experts) logits
#     (Qwen3 / Qwen3-Next style), so the `qwen` preset and the RouteHijack router
#     attack should apply — this is the key difference from DeepSeek's grouped/biased
#     gate, which cannot be steered. Verify the gate is a plain Linear before trusting.
#   • Qwen3.5 is HYBRID: most layers are Gated DeltaNet (linear-attention), with full
#     attention only periodically; MoE rides on top. The hook layer keys on `.mlp`
#     having `.gate` + `.experts`, so DeltaNet/attention-only layers are simply SKIPPED
#     — only true MoE layers are profiled. Confirm every block you expect is MoE.
#   • Like Qwen2-MoE / Qwen3-Next, there is a `shared_expert` (always-on). It is NOT
#     hooked (experts_attr="experts" grabs only the routed ModuleList) — correct, it
#     carries no routing-level safety signal.
#
# VERIFY against the real trust_remote_code modeling file + config.json:
#   [ ] model_type / architectures (qwen3_next? qwen3_5_moe?) → ArchSpec base/layers attrs
#   [ ] MoE block is layer.mlp with `.gate` (plain Linear) and `.experts` (ModuleList)
#   [ ] `.shared_expert` exists and is intentionally not hooked
#   [ ] which layer indices are MoE vs Gated-DeltaNet (only MoE layers get hooked)
#   [ ] n_layers / n_experts / top_k / d_model / moe_intermediate_size below
#
# Easiest correct path: pass the HF id straight to any script — if its model_type is
# already mapped (qwen3_moe / qwen3_next), dims auto-detect and you can skip this file.

model:
  hf_id: Qwen/Qwen3.5-35B-A3B          # ⚠ confirm the exact repo id
  dtype: bfloat16
  device_map: auto
  n_layers: 40                          # 35B-A3B: 40 layers (10 blocks × 4)  ⚠ verify
  n_experts: 256                        # routed experts (shared expert excluded)  ⚠ verify
  top_k: 8                              # routed experts per token  ⚠ verify
  d_model: 0                            # ⚠ FILL from config.json (hidden_size) — or auto-detect via HF id
  use_chat_template: true
  enable_thinking: false                # reasoning model — turn OFF thinking so t* is the answer decision
  arch:
    name: qwen                          # standard Linear gate assumed; see notes above

  # ── 397B-A17B flagship (swap into model: above if targeting it) ──
  # hf_id: Qwen/Qwen3.5-397B-A17B
  # n_layers: 60 · n_experts: 512 (10 routed + 1 shared active) · top_k: 10
  # d_model: 4096 · moe_intermediate_size (d_expert): 1024
  # ~397B bf16 ≈ ~800 GB → large multi-GPU only.

identify:
  pairs_path: ./data/llm_lat_pairs.jsonl
  general_corpus_path: ./data/c4_general.jsonl
  n_pairs: 600
  n_general: 5000
  top_pct: 0.20
  response_only: true

attacks:
  routehijack:
    suffix_len: 20
    n_steps: 300
    lambda_suppress: 3.0
    lambda_promote: 1.0
    lambda_refusal: 1.0
    promote_threshold: 0.3
    refusal_window: 1

eval:
  asr:
    judge_hf_id: cais/HarmBench-Llama-2-13b-cls
    n_prompts: 100
  mmlu:
    n_questions: 500
