# RouteHijack config — OLMoE-1B-7B-Instruct by default.
# Swap `model` for any MoE whose router/experts the ArchSpec can reach
# (presets: olmoe, mixtral, qwen — see model/archspec.py).

model:
  hf_id: allenai/OLMoE-1B-7B-0924-Instruct
  dtype: bfloat16
  device_map: auto
  n_layers: 16
  n_experts: 64
  top_k: 8
  d_model: 2048
  use_chat_template: true   # render prompts through the instruct chat template so the
                            # boundary token t* is the real decision point (§ Ternary loss).
  arch:
    name: olmoe             # module-layout preset; see model/archspec.py

identify:
  pairs_path: ./data/llm_lat_pairs.jsonl       # safe-refusal vs harmful-completion contrast pairs
  general_corpus_path: ./data/c4_general.jsonl # benign corpus for the utility penalty
  n_pairs: 600
  n_general: 5000
  top_pct: 0.20             # keep the top 20% of (layer, expert) pairs by score
  response_only: true       # response-driven profiling (mask query tokens)

attacks:
  routehijack:
    suffix_len: 20          # T — adversarial suffix length (paper: 20)
    n_steps: 300            # optimization steps
    lambda_suppress: 3.0    # λ1 — suppress safety-expert routing
    lambda_promote: 1.0     # λ2 — promote harmful-expert routing (bounded)
    lambda_refusal: 1.0     # λ3 — refusal-token unlikelihood
    promote_threshold: 0.3  # m_harm — harmful routing-mass target
    refusal_window: 1       # W decoding steps scored for refusal tokens (first step)

eval:
  asr:
    judge_hf_id: cais/HarmBench-Llama-2-13b-cls   # optional HarmBench grader (--judge)
    n_prompts: 100
  mmlu:
    n_questions: 500
