# RouteHijack config — Qwen3.6-35B-A3B (Qwen3.5-MoE class, hybrid attention).
#
# Dims VERIFIED from the HF config.json (Qwen/Qwen3.6-35B-A3B):
#   model_type qwen3_5_moe · architectures Qwen3_5MoeForConditionalGeneration
#   num_hidden_layers 40 · hidden_size 2048 · num_experts 256 · num_experts_per_tok 8
#   moe_intermediate_size 512 · shared_expert_intermediate_size 512 (shared expert present)
#   layer_types [linear_attention, full_attention] · full_attention_interval 4
#
# WHY THE ATTACK STILL APPLIES (unlike DeepSeek):
#   • The "hybrid" is in the ATTENTION sublayer (linear/Gated-DeltaNet attention with full
#     attention every 4 layers). Every decoder layer still has a STANDARD MoE `.mlp`
#     (SparseMoeBlock: `.gate` Linear → (T, n_experts) logits + `.experts` ModuleList), so all
#     40 layers are profiled and the `qwen` preset + router-logit attack work as-is.
#   • Like Qwen2-MoE, there is an always-on `.shared_expert` — NOT hooked (experts_attr="experts"
#     grabs only the routed ModuleList; the shared expert carries no routing-level safety signal).
#
# CONFIRM (custom trust_remote_code modeling for qwen3_5_moe):
#   [ ] MoE block is layer.mlp with `.gate` (plain Linear) + `.experts` (ModuleList)
#   [ ] `.shared_expert` exists and is intentionally left unhooked
#   [ ] gate is standard softmax top-k (NOT a DeepSeek-style sigmoid/biased/grouped gate)
#   [ ] needs `trust_remote_code=True` (loader already passes it)
#
# ~35B total / ~3B active — far more runnable than the 235B/397B siblings, but still expects a
# real GPU. You can also just pass the HF id to any script: model_type qwen3_5_moe auto-detects.

model:
  hf_id: Qwen/Qwen3.6-35B-A3B
  dtype: bfloat16
  device_map: auto
  n_layers: 40
  n_experts: 256
  top_k: 8
  d_model: 2048
  use_chat_template: true
  enable_thinking: false    # REASONING model — turn OFF chain-of-thought so the boundary
                            # token t* is the real answer decision (not "Here's a thinking
                            # process:"). Required for correct localization + ASR scoring;
                            # falls back to /no_think if this template ignores the kwarg.
  arch:
    name: qwen              # standard Qwen MoE gate; see notes above

identify:
  pairs_path: ./data/llm_lat_pairs.jsonl
  general_corpus_path: ./data/c4_general.jsonl
  n_pairs: 600
  n_general: 5000
  top_pct: 0.20
  response_only: true

attacks:
  routehijack:
    suffix_len: 20
    n_steps: 300
    lambda_suppress: 3.0
    lambda_promote: 1.0
    lambda_refusal: 1.0
    promote_threshold: 0.3
    refusal_window: 1
    lambda_target: 1.0      # affirmative-target (#1) anchors the attack on-topic — see configs/base.yaml
    target_len: 16
    ascii_only: false       # OFF: the target term now prevents the off-topic / foreign-language
                            # redirect, so keep the cross-lingual features (set true to also constrain)

eval:
  asr:
    judge_hf_id: meta-llama/Llama-Guard-3-1B   # fast taxonomy judge; gated (accept license + hf auth)
    judge_kind: llamaguard
    n_prompts: 100
  mmlu:
    n_questions: 500
